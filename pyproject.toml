[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xdl"
version = "0.1.0"
description = "Private, local batch downloader for X (Twitter) video posts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "owner" }]
dependencies = [
    # Core pipeline
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    # Round-3 decision: these are standard runtime deps (no extras) so a plain
    # install always ships the plan's own mitigations and the core web UI.
    "yt-dlp>=2024.8.6",   # resolver fallback adapter (resolve-only safety net)
    "fastapi>=0.111",      # xdl serve (M3)
    "uvicorn>=0.30",       # xdl serve (M3)
    "jinja2>=3.1",         # web UI templates (M3)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
xdl = "xdl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xdl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PTH", # use pathlib (Windows-first requirement)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# typer's API is literally "call Option() in the default"
"src/xdl/cli.py" = ["B008"]

[tool.mypy]
mypy_path = "src"
packages = ["xdl"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that hit real endpoints (deselect with '-m \"not live\"')",
]
